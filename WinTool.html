<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinTool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F8;--surface:#FFFFFF;--surface2:#F4F6FB;--border:#E2E7F0;--text:#1A1D2E;--text2:#5A6080;--text3:#9BA3C0;--accent:#6C5CE7;--accent2:#4F8EF7;--grad:linear-gradient(135deg,#6C5CE7 0%,#4F8EF7 100%);--grad-soft:linear-gradient(135deg,rgba(108,92,231,.1) 0%,rgba(79,142,247,.1) 100%);--green:#00B894;--red:#E84C6A;--yellow:#FDCB6E;--shadow-sm:0 2px 8px rgba(108,92,231,.07);--shadow:0 6px 24px rgba(108,92,231,.11);--r:14px;--r-sm:9px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;cursor:pointer;border:none;outline:none}

/* TITLEBAR */
.titlebar{position:fixed;top:0;left:0;right:0;z-index:200;height:50px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-logo{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(108,92,231,.35)}
.tb-logo svg{width:16px;height:16px;fill:#fff}
.tb-name{font-size:15px;font-weight:800;letter-spacing:-.4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-ver{font-size:11px;font-weight:600;color:var(--text3)}
.mode-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.mode-btn{padding:5px 16px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text2);background:none;transition:all .2s}
.mode-btn.active{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(108,92,231,.3)}
.srv-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--text3);transition:all .3s}
.srv-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s}
.srv-pill.ok{background:rgba(0,184,148,.08);border-color:rgba(0,184,148,.3);color:var(--green)}
.srv-pill.ok .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.srv-pill.err{background:rgba(232,76,106,.08);border-color:rgba(232,76,106,.3);color:var(--red)}
.srv-pill.err .dot{background:var(--red)}

/* LAYOUT */
.app{display:flex;height:100vh;padding-top:50px}

/* SIDEBAR */
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-inner{flex:1;overflow-y:auto;padding:14px 10px}
.sb-inner::-webkit-scrollbar{width:3px}
.sb-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);padding:10px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:2px;transition:all .15s;position:relative;border:1px solid transparent}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--grad-soft);border-color:rgba(108,92,231,.2)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--grad)}
.nav-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--surface2);transition:all .15s}
.nav-item.active .nav-icon{background:var(--grad-soft)}
.nav-label{font-size:13px;font-weight:600;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item.active .nav-label{color:var(--accent)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.nav-dot.ok{background:var(--green);box-shadow:0 0 5px rgba(0,184,148,.4)}
.nav-dot.err{background:var(--red)}
.nav-dot.run{background:var(--yellow);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb-footer{padding:12px;border-top:1px solid var(--border)}
.sb-footer-btn{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);background:none;font-size:12px;font-weight:600;color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:8px}
.sb-footer-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent)}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.etabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:none}
.etabs-bar.show{display:flex}
.etab{padding:11px 18px;font-size:13px;font-weight:600;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.etab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main-content{flex:1;overflow-y:auto;padding:24px}
.main-content::-webkit-scrollbar{width:5px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* LOADING */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--text3)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* PANEL HEADER */
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.panel-header-left{display:flex;align-items:center;gap:14px}
.panel-ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-sm)}
.panel-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.panel-desc{font-size:13px;color:var(--text2);margin-top:2px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.card-body{padding:16px 20px}

/* SCRIPT TAGS */
.stags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.stag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--grad-soft);color:var(--accent);border:1px solid rgba(108,92,231,.15);display:flex;align-items:center;gap:5px}
.stag-num{width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* EXEC BUTTON */
.exec-btn{width:100%;height:48px;border:none;border-radius:var(--r-sm);background:var(--grad);color:#fff;font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 20px rgba(108,92,231,.35);transition:box-shadow .2s,opacity .2s}
.exec-btn:hover:not(:disabled){box-shadow:0 8px 28px rgba(108,92,231,.45);opacity:.95}
.exec-btn:disabled{cursor:default}
.exec-btn .pfill{position:absolute;left:0;top:0;height:100%;width:var(--p,0%);background:rgba(255,255,255,.15);transition:width .4s ease;pointer-events:none}
.exec-btn.idle{background:var(--grad)}
.exec-btn.running{background:linear-gradient(135deg,#6C5CE7,#4F8EF7);opacity:.9}
.exec-btn.done-ok{background:linear-gradient(135deg,#00B894,#00CEC9);box-shadow:0 6px 20px rgba(0,184,148,.4);animation:sheen 1.5s ease-out}
.exec-btn.done-err{background:linear-gradient(135deg,#E84C6A,#E17055);box-shadow:0 6px 20px rgba(232,76,106,.35)}
@keyframes sheen{0%{box-shadow:0 0 0 0 rgba(0,184,148,.6)}60%{box-shadow:0 0 0 12px rgba(0,184,148,0)}100%{box-shadow:0 6px 20px rgba(0,184,148,.4)}}
.bspin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.exec-btn.running .bspin{display:block}

/* EXP RUN BTN */
.exp-run-btn{display:flex;align-items:center;gap:8px;padding:9px 20px;border-radius:var(--r);background:var(--grad);color:#fff;border:none;font-size:13px;font-weight:700;transition:all .2s;flex-shrink:0;min-width:130px;justify-content:center;box-shadow:0 4px 14px rgba(108,92,231,.3)}
.exp-run-btn:hover{opacity:.9;box-shadow:0 6px 20px rgba(108,92,231,.4)}
.exp-run-btn:disabled{opacity:.4;cursor:default}
.bspin2{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.exp-run-btn.running .bspin2{display:block}

/* ADV PANEL */
.adv-trigger{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);background:none;border:none;padding:10px 0 0;cursor:pointer;width:fit-content}
.adv-trigger svg{width:13px;height:13px;transition:transform .2s}
.adv-trigger.open svg{transform:rotate(180deg)}
.adv-panel{display:none;margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.adv-panel.open{display:block}

/* CONFIG */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);gap:10px}
.cfg-label{font-size:12px;font-weight:600;color:var(--text)}
.cfg-sub{font-size:10px;color:var(--text3);margin-top:1px}

/* TERMINAL */
.terminal{background:#0D1117;border:1px solid #21262D;border-radius:var(--r-sm);overflow:hidden;margin-top:12px}
.term-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#161B22;border-bottom:1px solid #21262D}
.term-dots{display:flex;gap:5px}
.td-r{width:10px;height:10px;border-radius:50%;background:#FF5F57}
.td-y{width:10px;height:10px;border-radius:50%;background:#FEBC2E}
.td-g{width:10px;height:10px;border-radius:50%;background:#28C840}
.term-title{font-size:10px;font-weight:700;color:#8B949E;text-transform:uppercase;letter-spacing:.07em}
.term-body{font-family:'Cascadia Code','Consolas',monospace;font-size:11.5px;line-height:1.7;padding:12px 14px;min-height:80px;max-height:220px;overflow-y:auto;color:#C9D1D9}
.term-body::-webkit-scrollbar{width:3px}
.term-body::-webkit-scrollbar-thumb{background:#30363D}
.ll{display:flex;gap:10px}.lt{color:#484F58;flex-shrink:0;font-size:10.5px}
.lk{color:#3FB950}.le{color:#F85149}.lw{color:#D29922}.li{color:#79C0FF}.ld{color:#6E7681}

/* TOGGLES */
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:999px;background:#CBD5E1;cursor:pointer;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-track::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-track::after{transform:translateX(16px)}
.num-in{width:68px;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px;text-align:right}
.num-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.12)}
.str-in{padding:4px 8px;border-radius:6px;width:110px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px}
.str-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.12)}

/* BADGES */
.sbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.sbadge.ready{background:var(--grad-soft);color:var(--accent)}
.sbadge.ok{background:rgba(0,184,148,.1);color:var(--green)}
.sbadge.error{background:rgba(232,76,106,.1);color:var(--red)}

/* HISTORY TABLE */
.htable{width:100%;border-collapse:collapse}
.htable th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:8px 14px;border-bottom:1px solid var(--border)}
.htable td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.htable tr:last-child td{border:none}
.htable tr:hover td{background:var(--surface2)}
.hbadge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.hbadge.ok{background:rgba(0,184,148,.1);color:var(--green)}
.hbadge.error{background:rgba(232,76,106,.1);color:var(--red)}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;z-index:999;padding:12px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:#fff;box-shadow:0 16px 48px rgba(108,92,231,.16);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:linear-gradient(135deg,#00B894,#00CEC9)}
.toast.err{background:linear-gradient(135deg,#E84C6A,#E17055)}
.toast.inf{background:var(--grad)}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center;color:var(--text3)}
.empty-ico{font-size:44px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13px}
</style>
</head>
<body>

<header class="titlebar">
  <div class="tb-brand">
    <div class="tb-logo"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 0h5v5H9V9z"/></svg></div>
    <span class="tb-name">WinTool</span>
    <span class="tb-ver">v3.0</span>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnSimple" onclick="setMode('simple')">✦ Simple</button>
    <button class="mode-btn"        id="btnExpert" onclick="setMode('expert')">⚙ Expert</button>
  </div>
  <div class="srv-pill" id="srvPill">
    <span class="dot"></span><span id="srvTxt">Connexion…</span>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-inner" id="sbInner"></div>
    <div class="sb-footer" id="sbFooter"></div>
  </aside>
  <main class="main">
    <div class="etabs-bar" id="etabsBar">
      <button class="etab active" id="etab-script"    onclick="setExpTab('script')">Script</button>
      <button class="etab"        id="etab-catconfig" onclick="setExpTab('catconfig')">Catégories</button>
      <button class="etab"        id="etab-history"   onclick="setExpTab('history')">Historique</button>
    </div>
    <div class="main-content" id="mainContent">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <span>Connexion au serveur…</span>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ================================================================
// CONSTANTES CATÉGORIES
// ================================================================
const CAT_DEFS = {
  nettoyage:   {label:'Nettoyage',    icon:'🧹', grad:'linear-gradient(135deg,#4F8EF7,#6C5CE7)'},
  appli:       {label:'Applications', icon:'🗑️', grad:'linear-gradient(135deg,#E17055,#E84C6A)'},
  performance: {label:'Performance',  icon:'⚡', grad:'linear-gradient(135deg,#00B894,#00CEC9)'},
  securite:    {label:'Sécurité',     icon:'🛡️', grad:'linear-gradient(135deg,#E84C6A,#6C5CE7)'},
  sante:       {label:'Santé',        icon:'💊', grad:'linear-gradient(135deg,#A29BFE,#6C5CE7)'},
  outillage:   {label:'Outillage',    icon:'🔧', grad:'linear-gradient(135deg,#00CEC9,#00B894)'},
  divers:      {label:'Divers',       icon:'⚙',  grad:'linear-gradient(135deg,#636E72,#2D3436)'},
};

const API = 'http://localhost:7171';

// ================================================================
// STATE
// ================================================================
let mode      = 'simple';
let serverOk  = false;
let SCRIPTS   = [];           // chargé dynamiquement depuis /scripts
let userVals  = {};           // {scriptId: {key: val}}
let scriptSt  = {};           // {scriptId: état}
let catSt     = {};           // {catId: état}
let catMap    = null;         // {catId: [scriptId, …]} — sauvegardé localStorage
let activeNav = null;
let expTab    = 'script';
let history   = JSON.parse(localStorage.getItem('wt-history') || '[]');
let okToday   = 0;

// ================================================================
// CHARGEMENT DYNAMIQUE DES SCRIPTS
// ================================================================
async function loadScripts() {
  try {
    const r    = await fetch(`${API}/scripts`, {signal: AbortSignal.timeout(3000)});
    const data = await r.json();

    SCRIPTS = data.map(s => ({
      ...s,
      // Générer un ID propre depuis le nom de fichier
      id: s.file.replace(/\.ps1$/, '').replace(/^\d+_/, '').replace(/_/g, '-'),
    }));

    // Initialiser les valeurs utilisateur
    SCRIPTS.forEach(s => {
      scriptSt[s.id] = 'idle';
      userVals[s.id] = {};
      (s.config || []).forEach(c => {
        userVals[s.id][c.key] = c.default;
      });
    });

    // Charger ou construire la catMap
    const saved = localStorage.getItem('wt-catmap');
    if (saved) {
      catMap = JSON.parse(saved);
      // Ajouter les nouveaux scripts non encore classés
      SCRIPTS.forEach(s => {
        const alreadyPlaced = Object.values(catMap).some(arr => arr.includes(s.id));
        if (!alreadyPlaced) {
          const cat = s.category || 'divers';
          if (!catMap[cat]) catMap[cat] = [];
          catMap[cat].push(s.id);
        }
      });
    } else {
      buildDefaultCatMap();
    }

    // Initialiser états catégories
    Object.keys(catMap).forEach(c => { catSt[c] = 'idle'; });

    return true;
  } catch(e) {
    return false;
  }
}

function buildDefaultCatMap() {
  catMap = {};
  SCRIPTS.forEach(s => {
    const cat = s.category || 'divers';
    if (!catMap[cat]) catMap[cat] = [];
    catMap[cat].push(s.id);
  });
}

// ================================================================
// SERVER PING + INIT
// ================================================================
async function ping() {
  try {
    const r = await fetch(`${API}/ping`, {signal: AbortSignal.timeout(1500)});
    if (r.ok && !serverOk) {
      serverOk = true;
      setSrvUI(true);
      // Premier ping réussi — charger les scripts
      const ok = await loadScripts();
      if (ok) {
        renderSidebar();
        document.getElementById('mainContent').innerHTML =
          '<div class="empty"><div class="empty-ico">⚙</div><p>Sélectionnez une catégorie dans la barre latérale.</p></div>';
      }
    } else if (!r.ok && serverOk) {
      serverOk = false; setSrvUI(false);
    }
  } catch {
    if (serverOk) { serverOk = false; setSrvUI(false); }
  }
}

function setSrvUI(ok) {
  const p = document.getElementById('srvPill');
  const t = document.getElementById('srvTxt');
  p.className = 'srv-pill' + (ok ? ' ok' : ' err');
  t.textContent = ok ? 'Serveur actif' : 'Hors ligne — lancer WinTool.bat';
  if (!ok) {
    document.getElementById('mainContent').innerHTML =
      `<div class="empty"><div class="empty-ico">⚠️</div>
       <p style="font-weight:600;margin-bottom:6px">Serveur non disponible</p>
       <p>Double-cliquez sur <strong>WinTool.bat</strong> pour démarrer.</p></div>`;
  }
}

// ================================================================
// MODE SWITCH
// ================================================================
function setMode(m) {
  mode = m;
  document.getElementById('btnSimple').classList.toggle('active', m === 'simple');
  document.getElementById('btnExpert').classList.toggle('active', m === 'expert');
  document.getElementById('etabsBar').classList.toggle('show', m === 'expert');
  activeNav = null;
  renderSidebar();
  document.getElementById('mainContent').innerHTML =
    '<div class="empty"><div class="empty-ico">⚙</div><p>Sélectionnez une catégorie.</p></div>';
}

// ================================================================
// SIDEBAR
// ================================================================
function renderSidebar() {
  const inner  = document.getElementById('sbInner');
  const footer = document.getElementById('sbFooter');

  if (!SCRIPTS.length) {
    inner.innerHTML = '<div style="padding:16px 10px;font-size:12px;color:var(--text3)">Chargement…</div>';
    return;
  }

  if (mode === 'simple') {
    // Une entrée par catégorie présente dans catMap
    const cats = Object.keys(catMap).filter(c => catMap[c].length > 0);
    inner.innerHTML = `
      <div class="sb-label">Catégories</div>
      ${cats.map(cat => {
        const def = CAT_DEFS[cat] || CAT_DEFS.divers;
        const st  = catSt[cat] || 'idle';
        return `
          <div class="nav-item ${activeNav===cat?'active':''}" onclick="selectNav('${cat}')">
            <div class="nav-icon">${def.icon}</div>
            <div class="nav-label">${def.label}</div>
            <div class="nav-dot ${st==='ok'?'ok':st==='error'?'err':st==='running'?'run':''}"></div>
          </div>`;
      }).join('')}`;
    footer.innerHTML = '';

  } else {
    // Expert : catégories + scripts individuels
    const cats = Object.keys(catMap).filter(c => catMap[c].length > 0);
    inner.innerHTML = `
      <div class="sb-label">Catégories</div>
      ${cats.map(cat => {
        const def = CAT_DEFS[cat] || CAT_DEFS.divers;
        return `
          <div class="nav-item ${activeNav==='cat:'+cat?'active':''}" onclick="selectNav('cat:${cat}')">
            <div class="nav-icon">${def.icon}</div>
            <div class="nav-label" style="font-size:12px">${def.label}</div>
          </div>`;
      }).join('')}
      <div class="sb-label" style="margin-top:8px">Scripts individuels</div>
      ${SCRIPTS.map(s => `
        <div class="nav-item ${activeNav===s.id?'active':''}" onclick="selectNav('${s.id}')">
          <div class="nav-icon" style="font-size:12px;font-weight:800;color:var(--accent);background:var(--grad-soft)">${s.file.slice(0,2)}</div>
          <div class="nav-label" style="font-size:12px">${s.title}</div>
          <div class="nav-dot ${scriptSt[s.id]==='ok'?'ok':scriptSt[s.id]==='error'?'err':scriptSt[s.id]==='running'?'run':''}"></div>
        </div>`).join('')}`;
    footer.innerHTML = `
      <button class="sb-footer-btn" onclick="selectNav('__history')">
        <span>📋</span> Historique
      </button>`;
  }
}

// ================================================================
// NAVIGATION
// ================================================================
function selectNav(id) {
  activeNav = id;
  renderSidebar();
  if (id === '__history') { renderHistory(); return; }
  renderPanel();
}

function renderPanel() {
  if (!activeNav) return;
  if (mode === 'simple') {
    renderSimpleCat(activeNav);
  } else {
    if (expTab === 'catconfig') { renderCatConfig(); return; }
    if (expTab === 'history')   { renderHistory(); return; }
    if (activeNav.startsWith('cat:')) renderExpCatPanel(activeNav.slice(4));
    else renderExpScriptPanel(activeNav);
  }
}

// ================================================================
// SIMPLE — Cat panel
// ================================================================
function renderSimpleCat(catId) {
  const def     = CAT_DEFS[catId] || CAT_DEFS.divers;
  const ids     = catMap[catId] || [];
  const scripts = ids.map(id => SCRIPTS.find(s => s.id === id)).filter(Boolean);
  const st      = catSt[catId] || 'idle';

  let btnClass = 'idle', btnTxt = '▶ Exécuter';
  if (st === 'running') { btnClass = 'running'; btnTxt = 'En cours…'; }
  if (st === 'ok')      { btnClass = 'done-ok';  btnTxt = '✓ Terminé'; }
  if (st === 'error')   { btnClass = 'done-err'; btnTxt = '⚠ Erreurs'; }

  // Options simples : bools non-hidden uniquement, max 8
  const cfgItems = scripts.flatMap(s =>
    (s.config || []).filter(c => c.type === 'bool' && !c.hidden).map(c => ({...c, sid: s.id}))
  ).slice(0, 8);

  const cfgRows = cfgItems.map(c => `
    <div class="cfg-row">
      <div>
        <div class="cfg-label">${c.label}</div>
        ${c.sub ? `<div class="cfg-sub">${c.sub}</div>` : ''}
      </div>
      <label class="toggle">
        <input type="checkbox" ${userVals[c.sid][c.key]?'checked':''} onchange="setV('${c.sid}','${c.key}',this.checked)">
        <div class="toggle-track"></div>
      </label>
    </div>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-ico" style="background:${def.grad}">${def.icon}</div>
        <div>
          <div class="panel-title">${def.label}</div>
          <div class="panel-desc">${scripts.length} script${scripts.length>1?'s':''} — ${scripts.map(s=>s.title).join(', ')}</div>
        </div>
      </div>
    </div>

    <div class="stags">
      ${scripts.map(s => `
        <div class="stag">
          <div class="stag-num">${s.file.slice(0,2)}</div>
          ${s.title}
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-body">
        <button class="exec-btn ${btnClass}" id="simExecBtn"
                onclick="runCat('${catId}')"
                ${st==='running'||!serverOk?'disabled':''}>
          <div class="pfill"></div>
          <div class="bspin"></div>
          <span id="simExecTxt">${btnTxt}</span>
        </button>
        <button class="adv-trigger" id="advTrigger" onclick="toggleAdv()">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 10.5L3 5.5h10z"/></svg>
          Avancé — options et journal
        </button>
        <div class="adv-panel" id="advPanel">
          ${cfgRows.length ? `<div class="cfg-grid">${cfgRows}</div>` : '<div style="font-size:12px;color:var(--text3)">Aucune option configurable en mode simple.</div>'}
          <div class="terminal" style="margin-top:12px">
            <div class="term-bar">
              <div class="term-dots"><div class="td-r"></div><div class="td-y"></div><div class="td-g"></div></div>
              <div class="term-title">Journal</div>
              <button style="background:none;border:none;font-size:10px;color:#6E7681;cursor:pointer" onclick="document.getElementById('catLog').innerHTML=''">Effacer</button>
            </div>
            <div class="term-body" id="catLog"><div class="ll"><span class="ld">En attente d'exécution…</span></div></div>
          </div>
        </div>
      </div>
    </div>`;
}

function toggleAdv() {
  document.getElementById('advPanel').classList.toggle('open');
  document.getElementById('advTrigger').classList.toggle('open');
}
function setV(sid, key, val) { userVals[sid][key] = val; }

// ================================================================
// RUN — Category (mode simple, silencieux)
// ================================================================
async function runCat(catId) {
  if (!serverOk) { toast('Serveur hors ligne — lancer WinTool.bat', 'err'); return; }
  const ids     = catMap[catId] || [];
  const scripts = ids.map(id => SCRIPTS.find(s => s.id === id)).filter(Boolean);

  catSt[catId] = 'running';
  updSimBtn('running', 0, scripts.length);
  renderSidebar();

  // Ouvrir le panel avancé auto pour voir les logs
  const ap = document.getElementById('advPanel');
  const at = document.getElementById('advTrigger');
  if (ap && !ap.classList.contains('open')) { ap.classList.add('open'); at && at.classList.add('open'); }
  const logEl = document.getElementById('catLog');
  if (logEl) logEl.innerHTML = '';

  let errors = 0;
  for (let i = 0; i < scripts.length; i++) {
    const s = scripts[i];
    catLog('li', `▶ ${s.title}…`);
    try {
      const r = await fetch(`${API}/run`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({script: s.file, config: userVals[s.id] || {}, silent: true})
      });
      const d = await r.json();
      if (d.ok) {
        scriptSt[s.id] = 'ok'; okToday++;
        catLog('lk', `  ✓ ${s.title} lancé en arrière-plan`);
        addHist(s.id, 'ok');
      } else {
        scriptSt[s.id] = 'error'; errors++;
        catLog('le', `  ✗ ${s.title} — ${d.error}`);
        addHist(s.id, 'error');
      }
    } catch(e) {
      scriptSt[s.id] = 'error'; errors++;
      catLog('le', `  ✗ ${s.title} — ${e.message}`);
    }
    updSimBtn('running', i + 1, scripts.length);
    await sleep(500);
  }

  const final = errors > 0 ? 'error' : 'ok';
  catSt[catId] = final;
  updSimBtn(final === 'ok' ? 'done-ok' : 'done-err', scripts.length, scripts.length);
  catLog(final === 'ok' ? 'lk' : 'le',
    final === 'ok' ? '✓ Tout terminé avec succès !' : `⚠ Terminé avec ${errors} erreur(s)`);
  const def = CAT_DEFS[catId] || CAT_DEFS.divers;
  toast(final === 'ok' ? `${def.label} — succès !` : `${errors} erreur(s)`, final === 'ok' ? 'ok' : 'err');
  renderSidebar();
}

function updSimBtn(cls, done, total) {
  const btn = document.getElementById('simExecBtn');
  const txt = document.getElementById('simExecTxt');
  if (!btn) return;
  btn.style.setProperty('--p', total > 0 ? Math.round(done/total*100)+'%' : '0%');
  btn.className = 'exec-btn ' + cls;
  btn.disabled  = cls === 'running' || !serverOk;
  if (txt) txt.textContent = cls==='running'?`En cours… (${done}/${total})`:cls==='done-ok'?'✓ Terminé':cls==='done-err'?'⚠ Erreurs':'▶ Exécuter';
}

function catLog(cls, msg) {
  const el = document.getElementById('catLog');
  if (!el) return;
  if (el.innerHTML.includes('En attente')) el.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'll';
  d.innerHTML = `<span class="lt">${now()}</span><span class="${cls}">${esc(msg)}</span>`;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

// ================================================================
// EXPERT — Script panel
// ================================================================
function renderExpScriptPanel(id) {
  const s  = SCRIPTS.find(x => x.id === id);
  if (!s) return;
  const st = scriptSt[id] || 'idle';
  const badge = `<span class="sbadge ${st==='ok'?'ok':st==='error'?'error':'ready'}">${st==='ok'?'✓ Succès':st==='error'?'✗ Erreur':'Prêt'}</span>`;

  // Tous les champs config (y compris hidden)
  const allCfg = (s.config || []).map(c => `
    <div class="cfg-row">
      <div>
        <div class="cfg-label">${c.label}${c.hidden?' <span style="font-size:9px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:4px">hidden</span>':''}</div>
        ${c.sub ? `<div class="cfg-sub">${c.sub}</div>` : ''}
      </div>
      ${renderCtrl(s.id, c)}
    </div>`).join('');

  const tags = (s.tags || []).map(t => `<span style="font-size:10px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--text3)">${t}</span>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-ico" style="background:var(--grad-soft);font-size:18px;font-weight:800;color:var(--accent)">${s.icon || s.file.slice(0,2)}</div>
        <div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="panel-title">${s.title}</div>${badge}
          </div>
          <div class="panel-desc">${s.desc || ''}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px;font-family:monospace">scripts/${s.file} · v${s.version||'1.0'}</div>
        </div>
      </div>
      <button class="exp-run-btn ${st==='running'?'running':''}" id="expRunBtn"
              onclick="runSingle('${s.id}')"
              ${st==='running'||!serverOk?'disabled':''}>
        <div class="bspin2"></div>
        <span>${st==='running'?'En cours…':'▶ Exécuter'}</span>
      </button>
    </div>

    ${tags ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${tags}</div>` : ''}

    <div class="card">
      <div class="card-header"><span class="card-title">Configuration</span></div>
      <div class="card-body">
        ${allCfg ? `<div class="cfg-grid">${allCfg}</div>` : '<span style="font-size:12px;color:var(--text3)">Aucune option configurable.</span>'}
      </div>
    </div>

    <div class="terminal">
      <div class="term-bar">
        <div class="term-dots"><div class="td-r"></div><div class="td-y"></div><div class="td-g"></div></div>
        <div class="term-title">Journal — ${s.title}</div>
        <button style="background:none;border:none;font-size:10px;color:#6E7681;cursor:pointer" onclick="document.getElementById('expLog').innerHTML=''">Effacer</button>
      </div>
      <div class="term-body" id="expLog"><div class="ll"><span class="ld">En attente…</span></div></div>
    </div>`;
}

// ================================================================
// EXPERT — Cat panel
// ================================================================
function renderExpCatPanel(catId) {
  const def     = CAT_DEFS[catId] || CAT_DEFS.divers;
  const ids     = catMap[catId] || [];
  const scripts = ids.map(id => SCRIPTS.find(s => s.id === id)).filter(Boolean);

  document.getElementById('mainContent').innerHTML = `
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-ico" style="background:${def.grad}">${def.icon}</div>
        <div><div class="panel-title">${def.label}</div><div class="panel-desc">${scripts.length} script(s)</div></div>
      </div>
    </div>
    ${scripts.map(s => `
    <div class="card">
      <div class="card-header"><span class="card-title">${s.file.slice(0,2)} — ${s.title}</span></div>
      <div class="card-body">
        <div class="cfg-grid">
          ${(s.config||[]).map(c => `
          <div class="cfg-row">
            <div>
              <div class="cfg-label">${c.label}</div>
              ${c.sub?`<div class="cfg-sub">${c.sub}</div>`:''}
            </div>
            ${renderCtrl(s.id, c)}
          </div>`).join('')}
        </div>
      </div>
    </div>`).join('')}`;
}

// ================================================================
// RUN — Single (expert, fenêtre visible)
// ================================================================
async function runSingle(id) {
  if (!serverOk) { toast('Serveur hors ligne', 'err'); return; }
  const s = SCRIPTS.find(x => x.id === id);
  scriptSt[id] = 'running';
  renderExpScriptPanel(s);
  expLog('li', `▶ Lancement de ${s.title}…`);
  expLog('ld', 'Une fenêtre PowerShell va s\'ouvrir en administrateur.');
  renderSidebar();

  try {
    const r = await fetch(`${API}/run`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({script: s.file, config: userVals[id] || {}, silent: false})
    });
    const d = await r.json();
    if (d.ok) {
      scriptSt[id] = 'ok'; okToday++;
      expLog('lk', '✓ Script lancé avec succès.');
      addHist(id, 'ok');
      toast(`${s.title} lancé !`, 'ok');
    } else {
      scriptSt[id] = 'error';
      expLog('le', `✗ Erreur : ${d.error}`);
      addHist(id, 'error');
      toast(`Erreur : ${d.error}`, 'err');
    }
  } catch(e) {
    scriptSt[id] = 'error';
    expLog('le', `✗ ${e.message}`);
    addHist(id, 'error');
    toast('Serveur inaccessible', 'err');
  }
  renderSidebar();
  renderExpScriptPanel(SCRIPTS.find(x => x.id === id));
}

function expLog(cls, msg) {
  const el = document.getElementById('expLog');
  if (!el) return;
  if (el.innerHTML.includes('En attente')) el.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'll';
  d.innerHTML = `<span class="lt">${now()}</span><span class="${cls}">${esc(msg)}</span>`;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

// ================================================================
// EXPERT TABS
// ================================================================
function setExpTab(tab) {
  expTab = tab;
  ['script','catconfig','history'].forEach(t => {
    document.getElementById('etab-'+t)?.classList.toggle('active', t === tab);
  });
  if (tab === 'history')   { renderHistory(); return; }
  if (tab === 'catconfig') { renderCatConfig(); return; }
  if (activeNav) renderPanel();
}

// ================================================================
// CAT CONFIG
// ================================================================
function renderCatConfig() {
  const cats = Object.keys(CAT_DEFS);
  document.getElementById('mainContent').innerHTML = `
    <div class="panel-header">
      <div><div class="panel-title">Configurer les catégories</div>
      <div class="panel-desc">Choisissez quels scripts apparaissent dans chaque catégorie du mode Simple.</div></div>
      <button onclick="saveCatMap()" style="padding:9px 20px;background:var(--grad);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,92,231,.3)">Sauvegarder</button>
    </div>
    ${cats.map(cat => {
      const def = CAT_DEFS[cat];
      return `
      <div class="card">
        <div class="card-header"><span class="card-title">${def.icon} ${def.label}</span></div>
        <div class="card-body" style="display:flex;flex-wrap:wrap;gap:8px">
          ${SCRIPTS.map(s => {
            const checked = (catMap[cat]||[]).includes(s.id);
            return `
            <label style="display:flex;align-items:center;gap:7px;padding:7px 12px;
                   background:${checked?'var(--grad-soft)':'var(--surface2)'};
                   border:1px solid ${checked?'rgba(108,92,231,.25)':'var(--border)'};
                   border-radius:var(--r-sm);cursor:pointer;font-size:12px;font-weight:600;
                   color:${checked?'var(--accent)':'var(--text2)'};transition:all .15s">
              <input type="checkbox" style="display:none" ${checked?'checked':''}
                     onchange="toggleCS('${cat}','${s.id}',this.checked)">
              <span style="font-size:10px;font-weight:800">${s.file.slice(0,2)}</span>
              ${s.title}
            </label>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}`;
}

function toggleCS(catId, scriptId, on) {
  if (!catMap[catId]) catMap[catId] = [];
  // Retirer de toutes les catégories d'abord si on l'ajoute
  if (on) {
    Object.keys(catMap).forEach(c => {
      catMap[c] = catMap[c].filter(s => s !== scriptId);
    });
    catMap[catId].push(scriptId);
  } else {
    catMap[catId] = catMap[catId].filter(s => s !== scriptId);
  }
}

function saveCatMap() {
  localStorage.setItem('wt-catmap', JSON.stringify(catMap));
  toast('Configuration sauvegardée', 'ok');
  renderSidebar();
}

// ================================================================
// HISTORY
// ================================================================
function addHist(scriptId, status) {
  const s = SCRIPTS.find(x => x.id === scriptId);
  history.unshift({scriptId, title: s?.title || scriptId, status, date: new Date().toISOString()});
  history = history.slice(0, 100);
  localStorage.setItem('wt-history', JSON.stringify(history));
}

function renderHistory() {
  if (!history.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="panel-header"><div><div class="panel-title">Historique</div></div></div><div class="empty"><div class="empty-ico">📋</div><p>Aucune exécution enregistrée.</p></div>';
    return;
  }
  const rows = history.slice(0,50).map(h => {
    const d = new Date(h.date);
    const fmt = d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<tr>
      <td><strong>${h.title}</strong></td>
      <td><span class="hbadge ${h.status}">${h.status==='ok'?'✓ Succès':'✗ Erreur'}</span></td>
      <td style="color:var(--text2)">${fmt}</td>
    </tr>`;
  }).join('');
  document.getElementById('mainContent').innerHTML = `
    <div class="panel-header">
      <div><div class="panel-title">Historique</div><div class="panel-desc">${history.length} exécution(s)</div></div>
      <button onclick="clearHist()" style="padding:7px 14px;border:1px solid rgba(232,76,106,.3);border-radius:var(--r-sm);background:rgba(232,76,106,.06);font-size:12px;font-weight:600;color:var(--red);cursor:pointer">Effacer</button>
    </div>
    <div class="card"><table class="htable">
      <thead><tr><th>Script</th><th>Statut</th><th>Date</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function clearHist() { history=[]; localStorage.setItem('wt-history','[]'); renderHistory(); toast('Historique effacé','inf'); }

// ================================================================
// UTILS
// ================================================================
function renderCtrl(sid, c) {
  const v = userVals[sid]?.[c.key] ?? c.default;
  if (c.type==='bool')   return `<label class="toggle"><input type="checkbox" ${v?'checked':''} onchange="setV('${sid}','${c.key}',this.checked)"><div class="toggle-track"></div></label>`;
  if (c.type==='number') return `<input class="num-in" type="number" min="0" value="${v}" oninput="setV('${sid}','${c.key}',+this.value)">`;
  if (c.type==='string') return `<input class="str-in" type="text" value="${esc(String(v))}" oninput="setV('${sid}','${c.key}',this.value)">`;
  return '';
}
function now() { return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
let toastTm;
function toast(msg, type) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  clearTimeout(toastTm); toastTm=setTimeout(()=>el.classList.remove('show'),3000);
}

// ================================================================
// INIT
// ================================================================
ping();
setInterval(ping, 4000);
</script>
