<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinTool</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

    <!-- data-tauri-drag-region rend la barre saisissable : la decoration
         native est desactivee, c'est nous qui fournissons tout le chrome. -->
    <header class="titlebar" data-tauri-drag-region>
      <span class="brand-mark">
        <svg class="ico i17" style="stroke-width:2.4" aria-hidden="true">
          <use href="#logo" />
        </svg>
      </span>
      <span class="brand-name" data-tauri-drag-region>WinTool</span>
      <span class="brand-ver" id="version">…</span>

      <div class="tb-search only-expert">
        <svg class="ico i14" aria-hidden="true"><use href="#search" /></svg>
        <input type="search" id="filtreLots" />
      </div>

      <!-- Reperes de l'assistant (specification §2) : ou on en est, jamais
           un menu — on ne saute pas une etape en cliquant dessus. -->
      <nav class="s-breadcrumb only-simple" id="sBreadcrumb" aria-hidden="true">
        <span data-crumb="1"><span id="crumb1"></span><i class="dot"></i></span>
        <span data-crumb="2"><span id="crumb2"></span><i class="dot"></i></span>
        <span data-crumb="3"><span id="crumb3"></span><i class="dot"></i></span>
      </nav>

      <div class="tb-right">
        <div class="seg" id="modeSeg" role="group">
          <button type="button" data-mode-btn="simple" aria-pressed="true"></button>
          <button type="button" data-mode-btn="expert" aria-pressed="false"></button>
        </div>

        <!-- Mode test : toujours visible, des deux cotes de l'application.
             Un mode test qu'on oublie est pire que pas de mode test. -->
        <button class="pill test" id="testPill" type="button" aria-pressed="false">
          <svg class="ico i14" aria-hidden="true"><use href="#shield" /></svg>
          <span id="testPillText"></span>
        </button>

        <button class="pill ok" id="adminPill" type="button">
          <svg class="ico i14" aria-hidden="true"><use href="#shield" /></svg>
          <span id="adminPillText"></span>
        </button>

        <button class="iconbtn" id="themeBtn" type="button">
          <svg class="ico i17" aria-hidden="true"><use href="#sun" /></svg>
        </button>

        <button class="iconbtn" id="btnSettings" type="button">
          <svg class="ico i17" aria-hidden="true"><use href="#settings" /></svg>
        </button>

        <div class="winctl">
          <button type="button" id="btnMin" class="min">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 12h16" /></svg>
          </button>
          <button type="button" id="btnMax" class="max">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" /></svg>
          </button>
          <button type="button" id="btnClose" class="close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="stage">
      <!-- Nappe de fond : une periode par motif, la plus lente. -->
      <svg class="water fond" viewBox="0 0 2360 760" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="eau" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--acc)" />
            <stop offset="1" stop-color="var(--acc-2)" />
          </linearGradient>
        </defs>
        <path d="M0,486 C147.5,436 442.5,536 590,486 C737.5,436 1032.5,536 1180,486 C1327.5,436 1622.5,536 1770,486 C1917.5,436 2212.5,536 2360,486 L2360,760 L0,760 Z"
              fill="url(#eau)" opacity="0.16" />
      </svg>

      <!-- Nappe de surface : deux periodes par motif, plus vive. -->
      <svg class="water surface" viewBox="0 0 2360 760" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,452 C98,402 197,402 295,452 C393,502 492,502 590,452 C688,402 787,402 885,452 C983,502 1082,502 1180,452 C1278,402 1377,402 1475,452 C1573,502 1672,502 1770,452 C1868,402 1967,402 2065,452 C2163,502 2262,502 2360,452 L2360,760 L0,760 Z"
              fill="url(#eau)" opacity="0.26" />
        <path d="M0,452 C98,402 197,402 295,452 C393,502 492,502 590,452 C688,402 787,402 885,452 C983,502 1082,502 1180,452 C1278,402 1377,402 1475,452 C1573,502 1672,502 1770,452 C1868,402 1967,402 2065,452 C2163,502 2262,502 2360,452"
              fill="none" stroke="var(--acc)" stroke-width="2.5" opacity="0.55" />
      </svg>

      <!-- Rappel permanent tant que le mode test est actif. -->
      <div id="testBanner" class="test-banner" hidden></div>

      <div id="majBanner" class="maj-banner" role="status" hidden>
        <span id="majTexte"></span>
        <span class="maj-actions">
          <button class="btn primary" type="button" id="majInstaller"></button>
          <button class="btn" type="button" id="majPlusTard"></button>
        </span>
      </div>

      <!-- Nouveautes du catalogue d'entretiens (§16.5) : meme gabarit que le
           bandeau de mise a jour, et la meme regle — proposer, jamais
           installer sans un clic. -->
      <div id="catBanner" class="maj-banner" role="status" hidden>
        <span id="catTexte"></span>
        <span class="maj-actions">
          <button class="btn primary" type="button" id="catInstaller"></button>
          <button class="btn" type="button" id="catPlusTard"></button>
        </span>
      </div>

      <div id="problems" class="problems-bar" hidden></div>

      <!-- Mode Simple (specification §2/§3/§15) : assistant en trois etapes,
           un seul domaine choisi a la fois. -->
      <section class="simple" id="simple" hidden>
        <div class="s-step" data-s="1">
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head-center">
                <h1 id="s1Titre"></h1>
                <p class="muted" id="s1Sous"></p>
              </div>
              <div id="recoCard"></div>
              <div class="sect" id="sectAutres"></div>
              <div class="buoys" id="buoysZone"></div>
              <div class="s-nav center">
                <button class="btn primary big" type="button" id="btnContinuerChoix"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="s-step" data-s="2" hidden>
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head">
                <button class="iconbtn" type="button" data-s-back>
                  <svg class="ico i17" aria-hidden="true"><use href="#arrow-left" /></svg>
                </button>
                <h2 id="recapTitre"></h2>
              </div>
              <div class="box">
                <div class="box-h" id="recapBoxTitre"></div>
                <div class="box-b list" id="recapZone"></div>
              </div>
              <p class="restore-note" id="restoreNote" hidden></p>
              <p class="restore-note" id="rebootNote" hidden></p>
              <div class="s-nav center">
                <button class="btn primary big lancer" type="button" id="btnLancerEntretien"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="s-step" data-s="3" hidden>
          <div class="rise" id="riseZone">
            <div class="rise-fill" id="riseFill">
              <svg class="rise-crest" viewBox="0 0 2360 44" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,44 L0,24 C98,-4 197,-4 295,24 C393,52 492,52 590,24 C688,-4 787,-4 885,24
                         C983,52 1082,52 1180,24 C1278,-4 1377,-4 1475,24 C1573,52 1672,52 1770,24
                         C1868,-4 1967,-4 2065,24 C2163,52 2262,52 2360,24 L2360,44 Z" fill="var(--acc)" />
              </svg>
              <div class="rise-badge" id="riseBadge">
                <b id="risePct">0 %</b><span id="riseBadgeLabel"></span>
              </div>
            </div>
          </div>
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head-center">
                <h1 id="s3Titre"></h1>
                <p class="muted" id="s3Sous"></p>
              </div>
              <div class="tasks-card">
                <div class="tasks-head">
                  <div class="tasks-pct" id="ringPct">0%</div>
                  <div>
                    <div class="tasks-bilan" id="tasksBilan" hidden></div>
                    <div class="muted" id="tasksBilanDetail"></div>
                  </div>
                </div>
                <div class="tasks" id="tasksList"></div>
              </div>
              <div class="s-nav center">
                <button class="detail-toggle" type="button" id="btnDetailTechnique"></button>
              </div>
              <div class="s-nav center">
                <button class="btn stop-pill" type="button" id="btnArreterEntretien"></button>
                <button class="btn primary" type="button" id="btnRetourAccueil" hidden></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Mode Expert (specification §2) : colonne gauche melant Lots (les
           categories) et Scripts, detail a droite, journal ancre en bas. -->
      <section class="expert">
        <aside class="lots">
          <div class="lots-rows" id="lotsRows"></div>

          <!-- Journal compact, ancre au pied de la colonne. Toujours visible,
               meme sans execution : c'est lui qui dit si quelque chose tourne.
               Les lignes sont tronquees faute de largeur ; « Étendu » et
               « Complet » ouvrent le panneau du bas pour les lire en entier. -->
          <button class="lots-journal" type="button" id="lotsJournal">
            <span class="lj-head">
              <span class="lj-kicker" id="ljKicker"></span>
              <span class="lj-etat" id="ljEtat"></span>
            </span>
            <span class="lj-body" id="ljBody"></span>
          </button>
        </aside>

        <div class="detail">
          <div class="dscroll" id="detailScroll"></div>
        </div>
      </section>

      <!-- Journal — partage entre les deux modes (le detail technique de
           l'entretien Simple, §2, est la meme sortie que le journal Expert).
           Pleine largeur, ancre en bas : « l'eau profonde » (specification
           §15.1). La v3 n'affichait jamais rien d'authentique ici : c'est
           le defaut que ce panneau corrige. -->
      <section class="term" id="term" hidden aria-live="polite">
        <svg class="term-crest" viewBox="0 0 2360 34" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,34 L0,18 C196,-8 393,44 590,18 C787,-8 983,44 1180,18 C1376,-8 1573,44 1770,18 C1967,-8 2163,44 2360,18 L2360,34 Z" fill="var(--term-bg)" />
        </svg>
        <div class="term-head">
          <div class="term-titlewrap">
            <span class="term-kicker">Journal</span>
            <span class="term-title" id="termTitle">…</span>
            <span class="term-sub" id="termSub">…</span>
          </div>
          <div class="term-actions">
            <div class="seg" id="consoleSeg">
              <button type="button" data-console-mode="compact" aria-pressed="true"></button>
              <button type="button" data-console-mode="etendu" aria-pressed="false"></button>
              <button type="button" data-console-mode="complet" aria-pressed="false"></button>
            </div>
            <button class="term-link" type="button" id="btnLog" hidden></button>
            <button class="term-link" type="button" id="btnEffacer"></button>
            <button class="btn danger" type="button" id="btnStop"></button>
            <button class="btn" type="button" id="btnCloseTerm" hidden></button>
          </div>
        </div>
        <div class="term-prog"><i id="termProg"></i></div>
        <div class="term-body" id="termBody"></div>
      </section>
    </main>

  </div>

  <!-- Premier lancement (specification §13) : bref, langue/theme, Commencer. -->
  <div class="backdrop" id="onboarding" hidden>
    <div class="onb-card">
      <div class="onb-mark"><svg class="ico i28" aria-hidden="true"><use href="#logo" /></svg></div>
      <h1 id="onbTitre"></h1>
      <p class="onb-text" id="onbTexte"></p>
      <div class="onb-choices">
        <div class="grp">
          <span class="lbl" id="onbLangueLabel"></span>
          <div class="seg" id="onbLangueSeg">
            <button type="button" data-onb-lang="fr">Français</button>
            <button type="button" data-onb-lang="en">English</button>
          </div>
        </div>
        <div class="grp">
          <span class="lbl" id="onbThemeLabel"></span>
          <div class="seg" id="onbThemeSeg">
            <button type="button" data-onb-theme="light"></button>
            <button type="button" data-onb-theme="dark"></button>
            <button type="button" data-onb-theme="system"></button>
          </div>
        </div>
      </div>
      <button class="btn primary big" type="button" id="btnCommencer" style="width:100%;margin-top:22px"></button>
    </div>
  </div>

  <!-- Reglages (specification §8) : theme/langue/mises a jour partout, le
       reste reserve au mode Expert. Sidemenu + numerotation discrete de
       chaque option (ex. 2.3) : demande explicite de l'utilisateur apres
       premier test, pour s'y retrouver et pouvoir designer une option
       precisement. -->
  <div class="backdrop" id="settingsOverlay" hidden>
    <div class="set-card">
      <div class="set-head">
        <h2 id="setTitre"></h2>
        <button class="iconbtn" type="button" id="btnFermerReglages">
          <svg class="ico i17" aria-hidden="true"><use href="#x" /></svg>
        </button>
      </div>
      <div class="set-body">
        <nav class="set-nav" id="setNav">
          <a href="#sec-general"><span class="num">1</span><span id="navGeneral"></span></a>
          <a href="#sec-catalogue"><span class="num">2</span><span id="navCatalogue"></span></a>
          <a href="#sec-expert" class="only-expert"><span class="num">3</span><span id="navExpert"></span></a>
          <a href="#sec-outils" class="only-expert"><span class="num">4</span><span id="navOutils"></span></a>
          <a href="#sec-config" class="only-expert"><span class="num">5</span><span id="navConfig"></span></a>
          <a href="#sec-histo"><span class="num">6</span><span id="navHisto"></span></a>
        </nav>

        <div class="set-scroll" id="setScroll">
          <section class="set-group" id="sec-general">
            <div class="set-group-title"><span class="num">1</span><span id="secGeneralTitre"></span></div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">1.1</span><span id="setThemeLabel"></span></span>
              <div class="seg" id="setThemeSeg">
                <button type="button" data-set-theme="light"></button>
                <button type="button" data-set-theme="dark"></button>
                <button type="button" data-set-theme="system"></button>
              </div>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">1.2</span><span id="setLangueLabel"></span></span>
              <div class="seg" id="setLangueSeg">
                <button type="button" data-set-lang="fr">Français</button>
                <button type="button" data-set-lang="en">English</button>
              </div>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">1.3</span><span id="setEchelleLabel"></span></span>
              <select class="cat-select" id="setEchelleSelect">
                <option value="1">100 %</option>
                <option value="1.15">115 %</option>
                <option value="1.3">130 %</option>
                <option value="1.5">150 %</option>
                <option value="1.75">175 %</option>
              </select>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">1.4</span><span id="setMajLabel"></span></span>
              <select class="cat-select" id="setMajSelect">
                <option value="propose"></option>
                <option value="never"></option>
              </select>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">1.5</span><span id="setMajVerifLabel"></span></span>
              <button class="btn compact" type="button" id="btnVerifierMaj"></button>
            </div>
            <p class="maj-etat" id="majEtat" aria-live="polite"></p>
          </section>

          <!-- Catalogue d'entretiens (specification §16) : visible dans les deux
               modes. Rien ne s'installe sans un clic. -->
          <section class="set-group" id="sec-catalogue">
            <div class="set-group-title"><span class="num">2</span><span id="secCatalogueTitre"></span></div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">2.1</span><span id="setCatalogueLabel"></span></span>
              <button class="btn compact" type="button" id="btnCatalogue"></button>
            </div>
            <p class="maj-etat" id="catalogueEtat" aria-live="polite"></p>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">2.2</span><span id="setCatalogueVerifLabel"></span></span>
              <select class="cat-select" id="setCatalogueSelect">
                <option value="startup"></option>
                <option value="manual"></option>
              </select>
            </div>
          </section>

          <section class="set-group only-expert" id="sec-expert">
            <div class="set-group-title"><span class="num">3</span><span id="setSectionExpert"></span></div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">3.1</span><span id="setEchecLabel"></span></span>
              <select class="cat-select" id="setEchecSelect">
                <option value="continue"></option>
                <option value="stop"></option>
              </select>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">3.2</span><span id="setJournauxLabel"></span></span>
              <input class="cat-select" type="number" id="setJournauxInput" min="0" step="10" style="width:90px" />
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">3.3</span><span id="setPolitiqueLabel"></span>
                <button class="aide" type="button" id="aidePolitique" aria-label="?">
                  <svg class="ico i14" aria-hidden="true"><use href="#help" /></svg>
                </button>
              </span>
              <select class="cat-select" id="setPolitiqueSelect">
                <option value="bypass">Bypass</option>
                <option value="remotesigned">RemoteSigned</option>
                <option value="unrestricted">Unrestricted</option>
              </select>
            </div>
            <div class="setrow">
              <span class="setrow-txt"><span class="num">3.4</span><span id="setNumerosLabel"></span></span>
              <button class="switch" type="button" role="switch" id="setNumerosToggle" aria-checked="false"></button>
            </div>
            <!-- Emplacements proteges (specification 12.4) : aucun reglage de
                 script ne peut les viser. La liste du systeme ne se retire pas. -->
            <div class="setrow">
              <span class="setrow-txt"><span class="num">3.5</span><span id="setProtegesLabel"></span>
                <button class="aide" type="button" id="aideProteges" aria-label="?">
                  <svg class="ico i14" aria-hidden="true"><use href="#help" /></svg>
                </button>
              </span>
            </div>
            <div class="box proteges">
              <p class="proteges-droits" id="protegesDroits" hidden>
                <span class="muted" id="protegesDroitsTexte"></span>
                <button class="btn compact" type="button" id="btnProtegesDroits"></button>
              </p>
              <p class="muted" id="protegesIntegresTitre"></p>
              <ul class="proteges-liste" id="protegesIntegres"></ul>
              <label class="muted" for="protegesAjouts" id="protegesAjoutsLabel"></label>
              <textarea class="mono" id="protegesAjouts" rows="3" spellcheck="false"></textarea>
              <div class="proteges-actions">
                <button class="btn compact" type="button" id="btnProtegesEnregistrer"></button>
                <span class="muted" id="protegesEtat" aria-live="polite"></span>
              </div>
            </div>
          </section>

          <section class="set-group only-expert" id="sec-outils">
            <div class="set-group-title"><span class="num">4</span><span id="secOutilsTitre"></span></div>
            <div class="setrow"><span class="num">4.1</span><button class="btn" type="button" id="btnOuvrirDossierReglages"></button></div>
            <p class="mono muted" id="cheminsScripts"></p>
            <div class="setrow"><span class="num">4.2</span><button class="btn" type="button" id="btnReanalyserReglages"></button></div>
            <div class="setrow"><span class="num">4.3</span><button class="btn" type="button" id="btnRapportConformite"></button></div>
            <div class="box" id="conformiteZone" hidden></div>
          </section>

          <section class="set-group only-expert" id="sec-config">
            <div class="set-group-title"><span class="num">5</span><span id="secConfigTitre"></span></div>
            <div class="setrow"><span class="num">5.1</span><button class="btn" type="button" id="btnExporterConfig"></button></div>
            <p class="muted" id="exportResultat" hidden></p>
            <div class="setrow">
              <span class="num">5.2</span>
              <button class="btn" type="button" id="btnImporterConfig"></button>
              <input type="file" id="fichierImportConfig" accept="application/json" hidden />
            </div>
            <p class="muted" id="importResultat" hidden></p>
            <div class="setrow"><span class="num">5.3</span><button class="btn danger" type="button" id="btnReinitialiserConfig"></button></div>
          </section>

          <section class="set-group" id="sec-histo">
            <div class="set-group-title"><span class="num">6</span><span id="secHistoTitre"></span></div>
            <div class="setrow"><span class="num">6.1</span><button class="btn" type="button" id="btnVoirHistorique"></button></div>
            <div class="box" id="historiqueZone" hidden></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Confiance a la premiere execution (specification §12.1) : seule
       exception au principe "constater, jamais bloquer" — une confirmation
       nommee, jamais une case a cocher reflexe. -->
  <div class="backdrop" id="trustOverlay" hidden>
    <div class="trust-card">
      <div class="trust-head">
        <h2 id="trustTitre"></h2>
        <p class="muted" id="trustSous"></p>
      </div>
      <div class="box" id="trustAttention" hidden></div>
      <div class="trust-code"><pre id="trustCode"></pre></div>
      <div class="s-nav">
        <button class="btn" type="button" id="btnTrustAnnuler"></button>
        <button class="btn primary" type="button" id="btnTrustApprouver"></button>
      </div>
    </div>
  </div>

  <!-- Choix d'icone : une vraie fenetre, avec recherche. La grille en ligne
       ne pouvait en montrer qu'une trentaine sans pousser le reste de la page
       hors de l'ecran. -->
  <div class="backdrop" id="iconesOverlay" hidden>
    <div class="ic-card">
      <div class="set-head">
        <h2 id="iconesTitre"></h2>
        <button class="iconbtn" type="button" id="btnFermerIcones">
          <svg class="ico i17" aria-hidden="true"><use href="#x" /></svg>
        </button>
      </div>
      <div class="ic-recherche">
        <svg class="ico i14" aria-hidden="true"><use href="#search" /></svg>
        <input type="search" id="rechercheIcone" />
      </div>
      <div class="ic-grille" id="iconesGrille"></div>
      <p class="muted" id="iconesCompte"></p>
    </div>
  </div>

  <!-- Des scripts, mais aucun catalogue (specification §16.6) : un rappel, une
       fois par session, avec un « ne plus afficher » respecte definitivement. -->
  <div class="backdrop" id="rappelCatalogue" hidden>
    <div class="onb-card">
      <div class="onb-mark"><svg class="ico i28" aria-hidden="true"><use href="#logo" /></svg></div>
      <h1 id="rappelTitre"></h1>
      <p class="onb-text" id="rappelTexte"></p>
      <label class="rappel-case"><input type="checkbox" id="rappelNePlus" /> <span id="rappelNePlusLabel"></span></label>
      <div class="s-nav center">
        <button class="btn" type="button" id="btnRappelFermer"></button>
        <button class="btn primary" type="button" id="btnRappelInstaller"></button>
      </div>
    </div>
  </div>

  <!-- Droits administrateur : ce que c'est, pourquoi, et comment les obtenir.
       L'application s'ouvre desormais sans eux (manifeste asInvoker) : il faut
       donc pouvoir expliquer la situation, pas seulement l'afficher. -->
  <div class="backdrop" id="droitsOverlay" hidden>
    <div class="onb-card">
      <div class="onb-mark"><svg class="ico i28" aria-hidden="true"><use href="#shield" /></svg></div>
      <h1 id="droitsTitre"></h1>
      <p class="onb-text" id="droitsTexte"></p>
      <div class="s-nav center" style="flex-wrap:wrap">
        <button class="btn" type="button" id="btnFermerDroits"></button>
        <button class="btn primary" type="button" id="btnRelancerAdmin" hidden></button>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
