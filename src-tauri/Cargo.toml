[package]
name = "wintool"
version = "4.0.0"
description = "Outil de maintenance Windows"
authors = ["Buly"]
edition = "2021"

[lib]
# Le suffixe _lib est necessaire sous Windows pour que le nom de la bibliotheque
# n'entre pas en conflit avec celui du binaire. Voir rust-lang/cargo#8519.
name = "wintool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Empreinte du contenu des scripts : identification des modifications et base
# de l'approbation avant premiere execution (specification 12.1).
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
